<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>강원테크노파크</title>
<link rel="icon" href="../shared/img/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="flap.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard Variable",Pretendard,sans-serif;color:#fff;background:#002049;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit}
.hd{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 60px;background:#fff;color:#111827}
.hd img{height:34px;display:block}
.menu a{font-size:17px;font-weight:600;text-decoration:none;margin-left:40px}
.wrap{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);min-height:calc(100vh - 72px)}
.first{padding:56px 56px 48px 60px;background:#E60934;display:flex;flex-direction:column}
.k{font-size:18px;font-weight:600;margin:0}
.big{display:flex;align-items:flex-end;gap:16px;margin:26px 0 30px}
.big .flap{--fh:236px;--fw:168px;--fs:170px;--fg:6px;--fr:8px;--flap-bg:#fff;--flap-fg:#E60934}
.big .u{font-size:34px;font-weight:700;padding-bottom:10px}
.fshort{font-size:34px;font-weight:700;line-height:1.3;margin:0}
.ftitle{font-size:17px;line-height:1.55;margin:10px 0 0;color:#fff}
.fend{font-size:20px;font-weight:600;margin:22px 0 0;font-variant-numeric:tabular-nums}
.go{display:inline-flex;align-items:center;height:56px;padding:0 28px;margin-top:auto;align-self:flex-start;background:#fff;color:#002049;font-size:18px;font-weight:700;text-decoration:none;border-radius:6px}
.rest{padding:48px 60px 40px 52px}
h1{font-size:40px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.25}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 18px}
.chip{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 13px;border:1px solid rgba(255,255,255,.36);border-radius:20px;background:transparent;color:#fff;font:inherit;font-size:16px;cursor:pointer}
.chip .ic{width:18px;height:18px}.chip b{font-weight:600;color:rgba(255,255,255,.72)}
.chip.on{background:#fff;color:#002049;border-color:#fff}.chip.on b{color:#002049}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;column-gap:18px;align-items:center;min-height:58px;text-decoration:none;color:#fff;border-top:1px solid rgba(255,255,255,.16)}
.flap{--fh:36px;--fw:26px;--fs:21px}
.unit{font-size:15px;margin-left:5px;color:rgba(255,255,255,.8)}
.r-short{display:block;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-title,.r-sec{display:none}
.r-end{font-size:16px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.85)}
.empty{font-size:17px}
@media (max-width:720px){
 .hd{height:56px;padding:0 20px}.hd img{height:26px}.menu{display:none}
 .wrap{display:block}
 .first{padding:24px 20px 26px}
 .big{margin:14px 0 18px}.big .flap{--fh:120px;--fw:86px;--fs:88px}.big .u{font-size:22px;padding-bottom:4px}
 .fshort{font-size:24px}.ftitle{font-size:15px}.fend{font-size:17px;margin-top:12px}.go{height:50px;margin-top:18px;font-size:16px}
 .rest{padding:26px 20px 30px}h1{font-size:26px}
 .chips{flex-wrap:nowrap;overflow-x:auto;margin:16px -20px 10px;padding:0 20px}.chip{flex:none}
 .row{grid-template-columns:70px minmax(0,1fr);grid-template-areas:"l m" "l e";padding:10px 0}
 .r-left{grid-area:l}.r-main{grid-area:m}.r-end{grid-area:e;font-size:15px}
 .r-short{font-size:16px;white-space:normal}
 .flap{--fh:34px;--fw:24px;--fs:20px}.unit{display:none}
}
</style>
</head>
<body>
<header class="hd">
 <a href="https://www.gwtp.or.kr/gwtp/index.php"><img src="../shared/img/logo-navy.png" alt="강원테크노파크"></a>
 <nav class="menu"><a href="https://www.gwtp.or.kr/gwtp/bbsNew_list.php?code=sub01a&keyvalue=sub01">공고안내</a><a href="https://www.gwtp.or.kr/gwtp/pageview.php?url=sub02a&keyvalue=sub02">사업안내</a><a href="https://www.gwtp.or.kr/gwtp/pageview.php?url=sub04a&keyvalue=sub04">입주안내</a><a href="https://www.gwtp.or.kr/gwtp/bbsNew_list.php?code=sub05a&keyvalue=sub05">경영공시</a><a href="https://www.gwtp.or.kr/gwtp/bbsNew_list.php?code=sub06a&keyvalue=sub06">TP NOW</a><a href="https://www.gwtp.or.kr/gwtp/pageview.php?url=sub07a&keyvalue=sub07">TP소개</a></nav>
</header>
<main class="wrap">
 <section class="first" id="first" aria-label="가장 먼저 마감하는 공고"></section>
 <section class="rest">
  <h1>지금 신청할 수 있는 지원사업</h1>
  <div class="chips" id="chips"></div>
  <div id="board"></div>
 </section>
</main>
<script src="../shared/base.js"></script>
<script src="../shared/notices.js"></script>
<script src="../shared/gw-core.js"></script>
<script src="icons.js"></script>
<script src="board-core.js"></script>
<script>
(function(){
 var L=GB.live(),n=L[0],d=GW.dday(n);
 var cells=String(d).split('').map(function(c){return '<span class="fc"><span class="ft"><i>'+c+'</i></span><span class="fb"><i>'+c+'</i></span></span>';}).join('');
 document.getElementById('first').innerHTML='<p class="k">가장 먼저 마감하는 공고</p><div class="big"><span class="flap" role="img" aria-label="마감까지 '+d+'일">'+cells+'</span><span class="u">일 남음</span></div>'+
  '<p class="fshort">'+GW.esc(n.short)+'</p><p class="ftitle">'+GW.esc(n.title)+'</p><p class="fend">'+GB.endText(n)+'</p><a class="go" href="'+n.url+'" target="_blank" rel="noopener">공고 보기</a>';
 GB.mount({board:document.getElementById('board'),chips:document.getElementById('chips'),still:true,chipOpts:{short:true}});
})();
</script>
</body>
</html>
