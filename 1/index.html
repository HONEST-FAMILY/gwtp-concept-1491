<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강원테크노파크</title>
<link rel="icon" href="../shared/img/favicon.png">
<style>
@font-face{font-family:'LINESeedKR';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Rg.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'LINESeedKR';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Bd.woff2') format('woff2');font-weight:700;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'LINESeedKR',sans-serif;color:#111827;background:#fff;-webkit-font-smoothing:antialiased}
a,button{color:inherit;text-decoration:none;font:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1440px;margin:0 auto;padding:0 60px}
header{position:absolute;inset:0 0 auto 0;z-index:5;color:#fff}
header .wrap{display:flex;align-items:center;height:96px;gap:48px}
header img{height:36px}
nav{display:flex;gap:44px;margin-left:auto;font-size:18px;font-weight:700}
.mbtn{display:none;margin-left:auto;color:#fff;width:44px;height:44px;align-items:center;justify-content:center}
.hero{position:relative;height:calc(100vh - 128px);min-height:620px;max-height:920px;overflow:hidden;background:#121a24;color:#fff}
.sc{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.sc.on{opacity:1}
.sc:nth-of-type(1){object-position:62% 45%}
.sc:nth-of-type(2){object-position:50% 30%}
.sc:nth-of-type(3){object-position:50% 50%}
.copy{position:absolute;left:0;right:0;bottom:56px}
h1{font-size:clamp(40px,6.6vw,100px);line-height:1.15;font-weight:700;letter-spacing:-0.025em}
.lead{margin-top:20px;font-size:20px;line-height:1.5}
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:44px;max-width:760px}
.prog button{text-align:left;font-size:16px;line-height:1.4;padding-top:14px;position:relative;opacity:.86}
.prog button::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,255,255,.45)}
.prog button::after{content:'';position:absolute;left:0;top:0;height:2px;width:0;background:#e60934}
.prog button.on{opacity:1}
.prog button.on::after{width:100%}
.prog b{display:block;font-size:17px}
.bar{background:#fff}
.bar .wrap{display:flex;gap:40px;padding-top:30px;padding-bottom:30px;align-items:flex-start}
.bar h2{font-size:18px;line-height:1.5;min-width:150px;max-width:190px;color:#002049;word-break:keep-all}
.bar h2 em{font-style:normal;color:#e60934}
.list{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;flex:1}
.nt{display:flex;flex-direction:column;gap:6px;font-size:16px;line-height:1.45}
.nt-d{font-weight:700;color:#002049}
.nt-d.urgent{color:#e60934}
.nt-t{font-weight:700;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nt-m{color:#4b5563;font-size:16px}
@media (max-aspect-ratio:4/5) and (min-width:901px){
  .hero{height:calc(100vh - 330px);max-height:none}
  .sc:nth-of-type(1){object-position:66% 50%}
  .sc:nth-of-type(2){object-position:42% 50%}
  .sc:nth-of-type(3){object-position:58% 50%}
  .copy{bottom:72px}
  .list{grid-template-columns:repeat(2,1fr);row-gap:26px}
}
@media (max-width:900px){
  .wrap{padding:0 20px}
  nav{display:none}
  .mbtn{display:flex}
  header .wrap{height:64px}
  header img{height:26px}
  .hero{height:76svh;min-height:540px}
  .copy{bottom:24px}
  h1{font-size:38px}
  .lead{font-size:16px;margin-top:12px}
  .prog{margin-top:24px;gap:12px}
  .prog button{font-size:15px;padding-top:10px}
  .prog span{display:none}
  .bar .wrap{flex-direction:column;gap:14px}
  .list{grid-template-columns:1fr;gap:18px}
  .nt-m{font-size:15px}
}

.sc{transition:opacity 1.1s cubic-bezier(.22,.61,.36,1);will-change:opacity,transform}
.prog button::after{width:100%;transform:scaleX(0);transform-origin:0 50%}
.prog button.on::after{width:100%}
.prog button::after{transform:scaleX(var(--p,0))}
h1 .ln{display:block;overflow:hidden;padding-bottom:.04em;margin-bottom:-.04em}
h1 .ln>span{display:block}
@media (prefers-reduced-motion:reduce){.sc{transition:none}}
</style>
</head>
<body>
<header><div class="wrap"><img src="../shared/img/logo-white.png" alt="강원테크노파크"><nav><a href="#">공고안내</a><a href="#">사업안내</a><a href="#">입주안내</a><a href="#">경영공시</a><a href="#">TP NOW</a><a href="#">TP소개</a></nav><button class="mbtn" aria-label="전체 메뉴"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div></header>
<section class="hero">
  <img class="sc on" src="assets/r6-cliff.jpg" srcset="assets/r6-cliff-m.jpg 1280w, assets/r6-cliff.jpg 2560w" sizes="100vw" alt="새벽빛이 드는 강원의 바위산">
  <img class="sc" src="assets/r6-sea.jpg" srcset="assets/r6-sea-m.jpg 1280w, assets/r6-sea.jpg 2560w" sizes="100vw" alt="강원 동해안">
  <img class="sc" src="assets/r7-chuncheon.jpg" srcset="assets/r7-chuncheon-m.jpg 1280w, assets/r7-chuncheon.jpg 2560w" sizes="100vw" alt="춘천 신북읍 강원테크노파크 일대">
  <div class="copy"><div class="wrap">
    <h1><span class="ln"><span>강원의 잠재력을 깨워,</span></span><span class="ln"><span>세계로</span></span></h1>
    <p class="lead">그 중심에 강원테크노파크가 있습니다</p>
    <div class="prog">
      <button class="on" data-i="0"><b>강원의 산</b><span>해 뜬 직후</span></button>
      <button data-i="1"><b>동해</b><span>세계로 가는 바다</span></button>
      <button data-i="2"><b>춘천 신북읍</b><span>그 중심</span></button>
    </div>
  </div></div>
</section>
<section class="bar"><div class="wrap"><h2>지금 신청할 수 있는 공고 <em data-open-count></em>건</h2><div class="list" data-notices="4"></div></div></section>
<script src="../shared/base.js"></script><script src="../shared/notices.js"></script><script src="../shared/gw-core.js"></script><script src="strip.js"></script>
<script>
(function(){
  var sc=[].slice.call(document.querySelectorAll('.sc')), bt=[].slice.call(document.querySelectorAll('.prog button'));
  var DUR=3400, reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cur=-1, t0=0, raf=0, push=null, intro=[];
  function show(i){
    cur=i;
    sc.forEach(function(s,k){s.classList.toggle('on',k===i)});
    bt.forEach(function(b,k){b.classList.toggle('on',k===i);b.classList.toggle('done',k<i)});
    if(reduce) return;
    if(push) push.cancel();
    push=sc[i].animate([{transform:'scale(1.0) translate3d(0,0,0)'},{transform:'scale(1.07) translate3d(-1.2%,-0.6%,0)'}],{duration:DUR+1100,easing:'cubic-bezier(.33,0,.4,1)',fill:'forwards'});
  }
  function tick(now){
    var e=now-t0, i=Math.floor(e/DUR)%sc.length;
    if(i!==cur) show(i);
    var p=(e%DUR)/DUR;
    bt.forEach(function(b,k){b.style.setProperty('--p',k<i?1:(k===i?p:0))});
    raf=requestAnimationFrame(tick);
  }
  function start(){
    cancelAnimationFrame(raf); cur=-1;
    intro.forEach(function(a){a.cancel()}); intro=[];
    if(reduce){show(0);return;}
    document.querySelectorAll('h1 .ln>span').forEach(function(el,k){intro.push(el.animate([{transform:'translateY(105%)'},{transform:'translateY(0)'}],{duration:1000,delay:120+k*130,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'}))});
    var lead=document.querySelector('.lead'), prog=document.querySelector('.prog');
    intro.push(lead.animate([{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:800,delay:520,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'}));
    intro.push(prog.animate([{opacity:0},{opacity:1}],{duration:800,delay:700,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'}));
    t0=performance.now(); raf=requestAnimationFrame(tick);
  }
  bt.forEach(function(b,k){b.addEventListener('click',function(){t0=performance.now()-k*DUR;cur=-1;})});
  window.__recStart=start;
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(start);
})();
</script>
</body>
</html>
