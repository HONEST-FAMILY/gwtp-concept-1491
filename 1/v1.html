<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강원테크노파크</title>
<link rel="icon" href="../shared/img/favicon.png">
<style>
@font-face{font-family:'LINESeedKR';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Rg.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'LINESeedKR';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Bd.woff2') format('woff2');font-weight:700;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'LINESeedKR',sans-serif;color:#111827;background:#fff;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1440px;margin:0 auto;padding:0 60px}
header{position:absolute;inset:0 0 auto 0;z-index:5;color:#fff}
header .wrap{display:flex;align-items:center;height:88px;gap:48px}
header img{height:34px}
nav{display:flex;gap:40px;margin-left:auto;font-size:17px;font-weight:700}
.hero{position:relative;height:100vh;min-height:680px;max-height:1000px;overflow:hidden;background:#1b2635}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%}
.hero .copy{position:absolute;left:0;right:0;bottom:96px;color:#fff}
.hero h1{font-size:72px;line-height:1.2;font-weight:700;letter-spacing:-0.02em}
.hero p{margin-top:20px;font-size:20px;line-height:1.5;opacity:.92}
.strip{background:#fff;border-bottom:1px solid #e5e7eb}
.strip .wrap{display:flex;align-items:stretch;gap:32px;padding-top:28px;padding-bottom:28px}
.strip h2{font-size:18px;font-weight:700;min-width:180px;line-height:1.5}
.list{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;flex:1}
.nt{display:flex;flex-direction:column;gap:8px;font-size:16px;line-height:1.45}
.nt-d{font-weight:700;color:#002049}
.nt-d.urgent{color:#c8102e}
.nt-t{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nt-m{color:#4b5563;font-size:15px}
@media (max-width:900px){
  .wrap{padding:0 20px}
  nav{display:none}
  header .wrap{height:64px}
  header img{height:26px}
  .hero{height:78svh;min-height:520px}
  .hero .copy{bottom:40px}
  .hero h1{font-size:34px}
  .hero p{font-size:16px}
  .strip .wrap{flex-direction:column;gap:16px}
  .list{grid-template-columns:1fr;gap:18px}
}
</style>
</head>
<body>
<header><div class="wrap"><img src="../shared/img/logo-white.png" alt="강원테크노파크"><nav><a href="#">공고안내</a><a href="#">사업안내</a><a href="#">입주안내</a><a href="#">경영공시</a><a href="#">TP NOW</a><a href="#">TP소개</a></nav></div></header>
<section class="hero">
  <img src="assets/s-chuncheon.jpg" alt="춘천 신북읍 강원테크노파크 일대 항공 사진">
  <div class="copy"><div class="wrap"><h1>강원의 잠재력을 깨워,<br>세계로</h1><p>그 중심에 강원테크노파크가 있습니다</p></div></div>
</section>
<section class="strip"><div class="wrap"><h2>지금 접수 중인 공고</h2><div class="list" data-notices="4"></div></div></section>
<script src="../shared/base.js"></script><script src="../shared/notices.js"></script><script src="../shared/gw-core.js"></script><script src="strip.js"></script>
</body>
</html>
