.street img{display:block;max-width:none}
.street figcaption{display:none}
.names{display:flex;gap:10px;padding:10px 60px 40px;font-size:15px;color:#565E6A;overflow:hidden;white-space:nowrap}
@media (max-width:760px){.hero{padding:28px 20px 0}.hero h1{font-size:34px}.hero p{font-size:15px}.street{padding:0 20px;height:220px;gap:6px}.street img{height:auto!important;max-height:200px}}

(function(){var G=window.GW,ol=document.getElementById('nl');if(!G||!ol)return;var n=parseInt(ol.dataset.n||'4',10);
