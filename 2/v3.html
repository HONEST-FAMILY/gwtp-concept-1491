<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>강원테크노파크</title><link rel="icon" href="../shared/img/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/spoqa/spoqa-han-sans@latest/css/SpoqaHanSansNeo.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Spoqa Han Sans Neo',sans-serif;background:#EEF0F2;color:#15181D;font-size:16px;line-height:1.5;word-break:keep-all;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.hd{display:flex;align-items:center;justify-content:space-between;padding:0 60px;height:76px}
.hd img{height:30px;display:block}
.hd nav{display:flex;gap:36px;font-size:16px;font-weight:500}
.hd nav a:hover{color:#565E6A}
.menu{display:none;background:none;border:0;font:inherit;font-size:16px;font-weight:700;color:#15181D;padding:10px 0}
.ns{background:#FFFFFF;padding:44px 60px 56px}
.ns h2{font-size:22px;font-weight:700;margin-bottom:18px}
.ns ol{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:0 28px}
.ns li{padding:18px 0;border-top:1px solid #15181D;display:flex;flex-direction:column;gap:8px}
.ns .dd{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.ns .dd.u{color:#E60934}
.ns .t{font-size:16px;font-weight:500;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ns .m{font-size:15px;color:#565E6A}
@media (max-width:1100px){.hd{padding:0 32px}.hd nav{gap:22px}.ns{padding:40px 32px}.ns ol{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.hd{padding:0 20px;height:60px}.hd img{height:24px}.hd nav{display:none}.menu{display:block}.ns{padding:32px 20px 40px}.ns ol{grid-template-columns:1fr}.ns .t{font-size:15px}}

.strip{overflow:hidden;position:relative}
.track{display:flex;width:max-content}
.city{flex:none;display:flex;flex-direction:column}
.city+.city{margin-left:var(--gap,10px)}
.city h3{font-size:18px;font-weight:700;height:40px;display:flex;align-items:flex-end;gap:8px;padding:0 0 10px}
.city h3 span{font-size:16px;font-weight:400;color:#565E6A}
.row{display:flex}
.row figure{flex:none;width:calc(var(--h) * var(--r))}
.ph{position:relative;height:var(--h);overflow:hidden}
.ph img{display:block;height:100%;width:100%;object-fit:cover}
.part .ph img:first-child{filter:grayscale(1);opacity:.42}
.part .band{position:absolute;inset:0;clip-path:inset(68% 0 14% 0)}
.row figcaption{font-size:16px;line-height:1.4;padding:12px 16px 0 0;display:flex;flex-direction:column;gap:2px}
.row figcaption span{color:#565E6A}

.hero{padding:36px 60px 0}
.hero h1{font-size:68px;line-height:1.16;font-weight:700;letter-spacing:-0.02em}
.hero p{margin-top:14px;font-size:18px;color:#565E6A}
.strip{margin:28px 0 48px;padding-left:60px;--h:400px}
@media (max-width:760px){.hero{padding:24px 20px 0}.hero h1{font-size:34px}.hero p{font-size:15px}.strip{padding-left:20px;--h:300px}}
</style></head><body><header class="hd"><a href="#"><img src="../shared/img/logo-navy.png" alt="강원테크노파크"></a>
<nav><a href="#">공고안내</a><a href="#">사업안내</a><a href="#">입주안내</a><a href="#">경영공시</a><a href="#">TP NOW</a><a href="#">TP소개</a></nav><button class="menu" type="button">메뉴</button></header><main><section class="hero"><h1>강원 여섯 도시,<br>기업이 일하는 열다섯 곳</h1>

ets/p-gn-semi.webp" alt="반도체부재공장"></div><figcaption>반도체부재공장</figcaption></figure></div></div><div class="city"><h3>태백<span>1곳</span></h3><div class="row"><figure style="--r:1.7922"><div class="ph"><img src="assets/p-taebaek.webp" alt="원료산업지원센터"></div><figcaption>원료산업지원센터</figcaption></figure></div></div><div class="city"><h3>삼척<span>2곳</span></h3><div class="row"><figure style="--r:2.2172"><div class="ph"><img src="assets/p-sc-energy.webp" alt="에너지방재지원센터"></div><figcaption>에너지방재지원센터</figcaption></figure><figure style="--r:2.5750"><div class="ph"><img src="assets/p-sc-bi.webp" alt="삼척창업보육센터"></div><figcaption>삼척창업보육센터</figcaption></figure></div></div></div></div></main><section class="ns" aria-label="지금 접수 중인 공고"><h2>지금 접수 중인 공고</h2><ol id="nl" data-n="4"></ol></section>
<script src="../shared/base.js"></script><script src="../shared/notices.js"></script><script src="../shared/gw-core.js"></script>
<script>
(function(){var G=window.GW,ol=document.getElementById('nl');if(!G||!ol)return;var n=parseInt(ol.dataset.n||'4',10);
var L=G.live().filter(function(x){var s=G.status(x);return s==='open'||s==='always'}).sort(G.byDeadline).slice(0,n);
ol.innerHTML=L.map(function(x){var b=G.badge(x),d=G.dday(x),u=(G.status(x)==='open'&&d!==null&&d<=3);

return '<li><span class="dd'+(u?' u':'')+'">'+G.esc(b.text)+'</span><a class="t" href="https://www.gwtp.or.kr/gwtp/bbsNew_list.php?code=sub01b&keyvalue=sub01">'+G.esc(x.title)+'</a><span class="m">'+G.esc(meta)+'</span></li>'}).join('');
var c=document.querySelectorAll('[data-count]');var open=G.live().filter(function(x){return G.status(x)==='open'}).length,alw=G.live().filter(function(x){return G.status(x)==='always'}).length;
c.forEach(function(e){e.textContent=e.dataset.count==='open'?open:alw});})();
</script></body></html>
